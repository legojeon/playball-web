<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#143637"><title>터치 위치 점검 · THREE OUTS</title>
<style>*{box-sizing:border-box}body{margin:0;background:#143637;color:#f4f5e8;font:14px -apple-system,BlinkMacSystemFont,sans-serif}#check{position:relative;height:100dvh;min-height:480px;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;outline:none}header,footer{position:absolute;left:0;right:0;padding:18px max(18px,env(safe-area-inset-left));pointer-events:none;background:linear-gradient(#123234ef,#12323400)}header{top:0;padding-top:max(18px,env(safe-area-inset-top))}footer{bottom:0;background:linear-gradient(#12323400,#123234f5 25%);padding-bottom:max(18px,env(safe-area-inset-bottom))}a,button,select{pointer-events:auto;font:inherit}a{color:#e1f3a9;text-decoration:none}h1{font-size:23px;margin:14px 0 8px}p{font-size:12px;line-height:1.6;margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap}button,select{border:1px solid #dceabb66;border-radius:8px;background:#163c3ce8;color:#fff;padding:9px 12px}#next{background:#e2efb4;color:#173731;font-weight:700}#result{font-size:18px;line-height:1.5}#metrics,#device{font-size:11px;line-height:1.6;color:#e1e9d0;white-space:pre-line}#device{opacity:.75;margin-top:8px}.mark{position:absolute;pointer-events:none;transform:translate(-50%,-50%);border-radius:50%;width:30px;height:30px;border:2px solid;z-index:2}.mark:after{content:'';position:absolute;width:4px;height:4px;left:11px;top:11px;border-radius:50%;background:currentColor}#ball-mark{color:#71eeec}#tap-mark{color:#ffbd8e;border-style:dashed;width:40px;height:40px}#tap-mark:after{left:16px;top:16px}[hidden]{display:none!important}</style>
<main id="check"><div id="pitch-mark-label" hidden style="position:absolute;z-index:36;pointer-events:none;font-size:10px;color:#f5eccb;background:#123436cc;padding:2px 4px;border-radius:4px;white-space:nowrap">○ 존 통과</div><div id="review-label" hidden style="position:absolute;right:12px;top:151px;z-index:35;font-size:10px;color:#c4ebee;pointer-events:none">판정 순간 · 측면</div><canvas tabindex="0" id="field" aria-label="터치 점검용 야구 공"></canvas><header><a href="./play.html">← 게임으로 돌아가기</a><h1>누른 채 조준하고 떼어보세요</h1><p>보이는 공에 배트를 조준하고 손을 떼세요.<br>누른 배트는 입력 위치에 고정되고, 놓을 때 접촉 보정이 적용됩니다.</p><div class="row"><button id="fixed">고정 공</button><button id="approach">접근 공</button><button id="late">늦은 스윙</button><button id="moving">움직이는 공</button><select id="fps" aria-label="화면 갱신 상한"><option value="120">최대 120fps</option><option value="60">최대 60fps</option><option value="30">최대 30fps</option><option value="20">최대 20fps</option></select></div></header><div id="ball-mark" class="mark" hidden></div><div id="tap-mark" class="mark" hidden></div><footer><strong id="result" role="status">정지한 공의 중심을 터치하세요</strong><p id="metrics">게임과 같은 카메라·좌표 변환·입력 코드를 사용합니다.</p><button id="next">다음 공</button><div id="device"></div></footer><span id="runner1" hidden></span><span id="runner2" hidden></span><span id="runner3" hidden></span></main><script type="module" src="./touch-check.js?v=108"></script></html>
